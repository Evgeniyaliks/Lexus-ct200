name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: unzip -o Lexus-ct200.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        working-directory: src
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp src/app/build/outputs/apk/debug/app-debug.apk CT200h-Monitor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CT200h Monitor ${{ github.run_number }}
          make_latest: true
          files: CT200h-Monitor.apk
